# 개발용: 몸(시뮬레이터)을 Docker로 띄운다. 화면(bench)과 두뇌(brain)는 이 PC에서 돌린다.
#   docker compose up -d --build sim        띄우기 (http://localhost:8765)
#   docker compose run --rm sim pytest      시험
name: robot-brain-lab

services:
  sim:
    build:
      context: .
      dockerfile: sim/Dockerfile
    ports:
      - "${SIM_PORT:-8765}:8765"
    # 고친 코드를 이미지를 다시 만들지 않고 바로 쓰도록 소스와 내려받은 몸 파일을 붙인다.
    volumes:
      - ./sim:/app
      - ./contracts:/contracts:ro
    restart: unless-stopped

  # ROS 2 쪽 몸: 몸의 WebSocket을 ROS 2 토픽·서비스로 내는 드라이버와 rosbridge (두뇌가 BODY_LINK=ros로 붙는다)
  #   docker compose up -d --build ros     (코드를 고치면 docker compose build ros)
  #   docker compose exec ros bl01-record  토픽을 rosbag2로 남기기 (results/bags)
  ros:
    build:
      context: .
      dockerfile: ros/Dockerfile
    ports:
      - "${ROSBRIDGE_PORT:-9090}:9090"
    volumes:
      - ./results/bags:/bags
    environment:
      SIM_WS_URL: ${ROS_SIM_WS_URL:-ws://sim:8765/ws}
    depends_on:
      sim:
        condition: service_healthy
    restart: unless-stopped
